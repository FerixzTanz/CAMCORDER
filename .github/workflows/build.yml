name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        # 手动跑的时候勾上它（只在 main 上有效）：由这次构建自己打 v<versionName> 的 tag 并发布 Release，
        # 和推 tag 发布的结果一样。给推不了 tag 的环境用；tag 已经存在就失败，不覆盖已经发出去的版本。
        description: 'Publish a release: tag v<versionName> on this commit (main only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 默认会装模拟器，我们只是编译 APK 用不到它；
          # 而且它下载失败过一次（Error on ZipFile unknown archive），
          # 白白多一个失败点。Gradle 会自行拉取真正需要的 SDK 组件。
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 纯 JVM 单元测试：合成流几何拆分与相机选择逻辑
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          VERSION=$(grep -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          OUT="CAMCORDER-${VERSION}-${SHORT_SHA}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAMCORDER-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # 打 tag 时自动发布 Release，车机/手机可直接下载安装
      # Release 正文由 CHANGELOG.md 里对应版本的小节自动生成，
      # 这样每个版本的说明就是它自己的改动，而不是每次都一样的模板。
      # 这次要不要发布：推了 v* 的 tag，或者在 main 上手动跑并勾了 publish
      - name: Decide whether to publish
        id: release
        env:
          VERSION: ${{ steps.apk.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.publish }}" == "true" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "::error::publish only runs on main (this run is on ${GITHUB_REF})"
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
              echo "::error::tag v${VERSION} already exists; bump versionName before publishing again"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        if: steps.release.outputs.publish == 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          python3 .github/scripts/release_notes.py "${{ steps.apk.outputs.version }}" > RELEASE_NOTES.md
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      - name: Publish release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # 推 tag 发布时为空（用推的那个 tag）；手动发布时是 v<versionName>，打在这次构建的提交上
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.apk.outputs.path }}
          # 带后缀的（-alpha / -beta）是测试版；1.0.0 这种不带后缀的是正式版，显示为 Latest
          prerelease: ${{ contains(steps.apk.outputs.version, '-') }}
          # CAMCORDER：直接公开发布（原项目 2026-09-29 起一律建成草稿）
          draft: false
          name: ${{ steps.apk.outputs.version }}
          body_path: RELEASE_NOTES.md
